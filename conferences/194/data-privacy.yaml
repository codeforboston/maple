id: data-privacy
name: Data Privacy
court: 194
title: An Act establishing the Massachusetts data privacy act
gist: Both bills would create a state consumer data privacy law, enforced by the Attorney General, giving residents the right to see, correct and delete their data and opt out of targeted ads and data sales. They differ most on whether individuals could sue, whether selling sensitive data would be banned, how much data companies could collect and which businesses would be covered.
