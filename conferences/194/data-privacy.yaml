differences:
  - heading: Should individuals be able to sue companies that break the law, or only the Attorney General?
    senate: Only the Attorney General may sue. The bill overrides the parts of the state consumer protection law (G.L. c. 93A) that would otherwise let consumers sue. (§1, new G.L. c. 93M §10(b))
    house: Yes, against the largest companies. Individuals may sue "large data holders" (companies with data on more than 2,000,000 consumers, or sensitive data on more than 200,000) under the state consumer protection law (G.L. c. 93A), including in class actions. Only the Attorney General may sue other companies. Money awarded in a class action is reduced by anything the Attorney General recovers for the same violation, and damages are put on hold until the Attorney General says whether it is seeking recovery, for up to 1 year after liability is found. (§1, new G.L. c. 93M §1, §14(a))
  - heading: Should selling sensitive data be banned, or allowed with the consumer's consent?
    senate: Banned. The ban also applies to organizations otherwise exempt from the law, if they meet its size thresholds. (§1, new G.L. c. 93M §3(a), §5(a)(iv))
    house: Allowed if the consumer gives affirmative consent, except precise location data, which may never be sold. Organizations otherwise exempt from the law must follow this rule too. (§1, new G.L. c. 93M §3(b), §7(a)(i))
  - heading: How much personal data may companies collect in general?
    senate: Only what is "reasonably necessary to provide or maintain a specific product or service requested by the consumer." (§1, new G.L. c. 93M §5(a)(i)–(ii))
    house: What is "reasonably necessary and proportionate" to the purposes the company has disclosed, consistent with what consumers would reasonably expect. (§1, new G.L. c. 93M §6(1)–(2))
  - heading: Should all data about minors count as sensitive data?
    senate: Only data about a "child" as defined by the federal children's online privacy law (COPPA), which covers children under 13. (§1, new G.L. c. 93M §1 "sensitive data" (vi))
    house: Yes, data about anyone the company knows, or willfully disregards, is under 18. Products used mostly by minors also need a risk assessment. (§1, new G.L. c. 93M §1; §10(a)(5))
  - heading: Which businesses should the law cover?
    senate: Businesses that, in the prior year, handled data on at least 60,000 Massachusetts residents; or on at least 20,000 residents while earning at least 20% of their revenue from selling data; or any reproductive or sexual health data. Affiliates that passed sensitive data to such a business are also covered. Data used only to process payments doesn't count. (§1, new G.L. c. 93M §2)
    house: Businesses that operate in Massachusetts and target products or services to its residents and, in the prior year, handled data on at least 100,000 residents; or earned at least $100,000 from selling data; or handled any sensitive data. Data used only to process payments doesn't count. (§1, new G.L. c. 93M §2)
  - heading: Should companies get a chance to fix a violation before the Attorney General sues?
    senate: Yes. The Attorney General must first send notice and give the company 60 days to fix the problem, unless the Attorney General decides it can't be fixed or needs immediate enforcement. This rule ends June 1, 2027. (§1, new G.L. c. 93M §10(d); §§2, 4)
    house: No. The bill has no waiting period. (§1, new G.L. c. 93M §14)
  - heading: When automated profiling is used in a major decision about someone, such as a loan, housing or a job, should the person get an explanation and a chance to challenge it?
    senate: Yes, for decisions on lending, housing, insurance, education, jobs, health care and similar matters. People may learn the reasons, what they could have done differently and what data was used, and may have wrong data corrected and the decision reconsidered. (§1, new G.L. c. 93M §4(b))
    house: Not in the bill. Both bills let consumers opt out of this kind of profiling. (§1, new G.L. c. 93M §4(a)(6))
  - heading: When may companies collect and use sensitive data, such as health or biometric data?
    senate: Only when "strictly necessary" to provide a product or service the consumer asked for. Passing it to others also requires the consumer's affirmative consent. (§1, new G.L. c. 93M §5(a)(iii), (v))
    house: Whenever the consumer gives affirmative consent. There is no "strictly necessary" limit. (§1, new G.L. c. 93M §6(3))
  - heading: Should union membership, military or veteran status, and data from fitness and wellness apps count as sensitive data?
    senate: Not listed as sensitive. Wellness data counts only if it reveals a health condition, diagnosis, disability or treatment. (§1, new G.L. c. 93M §1 "sensitive data")
    house: Yes, all three are listed as sensitive. (§1, new G.L. c. 93M §1 "sensitive data," "consumer health and wellness data")
  - heading: Should companies have to delete data on a schedule and tell consumers how long they keep it?
    house: Yes. Companies must delete personal data when the law requires it or when it is no longer needed, and privacy notices must say how long each kind of data is kept or how that is decided. (§1, new G.L. c. 93M §6(4), §8(a)(vi))
  - heading: Should health care organizations covered by federal HIPAA rules, educational nonprofits and colleges, and blood banks be exempt?
    senate: HIPAA-covered organizations are exempt only if they handled data on 60,000 or fewer consumers. Health information protected by HIPAA is exempt either way. Educational nonprofits and blood banks are not exempt. (§1, new G.L. c. 93M §3(a)(vii), (b)(i))
    house: All HIPAA-covered organizations are exempt regardless of size, as are educational nonprofits "including an institution of higher education" and nonprofit blood banks. They must still follow the rules on selling data. (§1, new G.L. c. 93M §3(a)(6), (7), (9), §3(b))
  - heading: What must a company know about a user's age before the ban on targeted ads to minors and selling minors' data applies?
    senate: That it "knows or should have known" the user is under 18. (§1, new G.L. c. 93M §5(a)(vi))
    house: That it "has actual knowledge or willfully disregards" that the user is under 18. (§1, new G.L. c. 93M §7(a)(ii))
  - heading: Must the Attorney General write regulations, and by when?
    senate: No. The Attorney General "may" write rules, with no deadline. (§1, new G.L. c. 93M §10(a))
    house: Yes. The Attorney General "shall" write rules by May 1, 2027 on de-identification, data security, deceptive design ("dark patterns"), unfair data practices, risk assessments and privacy notices. (§1, new G.L. c. 93M §13; §3)
  - heading: Should the state study how to regulate data brokers, and should the Attorney General report on enforcement each year?
    house: Yes. The Office of Consumer Affairs and Business Regulation studies data broker regulation, including the cost of a registry, by July 1, 2027. The Attorney General reports on enforcement every year starting March 1, 2028. (§1A; §1, new G.L. c. 93M §14(c); §4)
similarities:
  - heading: Residents could see, correct, delete and move their data, and opt out of targeted ads, data sales and profiling.
    body: Seeing their data would include any conclusions a company drew from it. The profiling opt-out covers automated profiling used in major decisions about them.
  - heading: Selling precise location data would be banned, even with consent.
    body: This covers location data precise to within 1,750 feet, collected in Massachusetts.
  - heading: Targeting ads at anyone under 18, or selling their data, would be banned.
    body: The bills differ on what a company must know about a user's age.
  - heading: Companies could not punish consumers for using their privacy rights.
    body: They may not deny service or charge more to people who use their rights, though genuine loyalty programs are allowed.
  - heading: Companies could not use personal data to discriminate.
    body: Both bar discrimination based on race, sex, sexual orientation, gender identity, disability, religion, immigration status and other grounds protected by state anti-discrimination law.
  - heading: Government agencies, banks, credit unions and several other regulated organizations would be exempt.
    body: Nonprofits in general would not be exempt, though groups that fight insurance fraud would be. The House exempts more organizations.
  - heading: Data already covered by other privacy laws would be exempt.
    body: That includes health, financial, credit, student and driver records already protected by federal law, some research data, and employment and benefits data.
  - heading: Selling data would include trading it for anything of value, and consent would have to be clear, specific and informed.
    body: Agreeing to broad terms of use, or being steered by a misleading website design, wouldn't count as consent. Withdrawing consent would have to be as easy as giving it.
  - heading: Companies would have to keep data secure and assess high-risk uses.
    body: Both require reasonable data security and written risk assessments for targeted ads, data sales, risky profiling and sensitive data.
  - heading: Consumers would have at least two secure ways to make requests, and a right to appeal a refusal.
    body: Consumers wouldn't need an account. Companies would have to respond within 45 days, with extensions allowed, decide appeals within 60 days, and say how to complain to the Attorney General.
