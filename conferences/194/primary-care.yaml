differences:
  - heading: By when should primary care make up 9%, 12% and 15% of the state's total health care spending?
    senate: 9% in 2028, 12% in 2029 and 15% in 2030. From 2031, the Health Policy Commission may recommend changes after a hearing and a two-thirds vote, but never below 15%. (§8, new G.L. c. 6D §9A)
    house: 9% in 2030, 12% in 2033 and 15% from 2036 on. The state health data agency (CHIA) reports on progress every year starting in 2028. (§6, new G.L. c. 6D §9A)
  - heading: Should large provider organizations be required to use a new payment model that pays primary care practices a fixed monthly amount per patient?
    senate: Required for provider organizations that must register with the Health Policy Commission and provide primary care, with every insurer and the state employee health plan (GIC). Others may join. Final guidance by Dec. 31, 2027. (§5, new G.L. c. 6D §3B(b); §30)
    house: Optional for providers. Each insurer must offer at least one approved model to every primary care provider it contracts with by Jan. 1, 2028, and the GIC must offer one. (§35, new G.L. c. 176O §31; §§23, 47)
  - heading: Should each health care provider group and insurer have its own primary care spending target, with improvement plans and fines?
    senate: Yes. Each flagged provider group or insurer gets the same 9%, 12% and 15% targets. The Health Policy Commission may require an improvement plan and, as a last resort, impose penalties up to $500,000 for a first violation, $750,000 for a second, and up to the amount of the shortfall after that. (§§8–9, 15–16)
    house: No individual targets. The Health Policy Commission can already require organizations whose costs grew faster than the state benchmark to file a performance improvement plan. Starting in 2028, the House would let it require a primary care commitment the organization designs instead, after reviewing CHIA's analysis of the organization's primary care spending. Groups with 15,000 or fewer patients, or under $25,000,000 a year from insurers, are exempt, as they already are from improvement plans. (§§7, 10, 17–18)
  - heading: Should there be no time limit, and no cap on damages, for civil lawsuits over sexual abuse of a minor?
    house: Yes. Lawsuits could be filed at any time, claims whose deadlines have already passed could be filed within 2 years, and damage caps for charities and public employers would not apply. (§§50–58) The House also lengthens the time to bring criminal charges for two sex offenses. (§§59–60)
  - heading: Should insurers' use of artificial intelligence and other automated tools to review coverage be limited?
    senate: Not in the bill. The Senate bill only requires insurers to report to CHIA what their coverage reviews cost. (§13)
    house: Yes. An automated tool may not be the only basis for denying coverage, and only a licensed clinician may deny. Insurers must disclose their use of these tools and report every year, with fines up to $5,000 a day. Starts Jan. 1, 2027. (§34, new G.L. c. 176O §12C; §49)
  - heading: Should insurers and pharmacy benefit managers pass most drug rebates on to patients at the pharmacy counter?
    house: Yes. At least 80% of expected rebates must go toward lowering what patients pay at the pharmacy, including in the state employee health plan. Fines up to $5,000 a day. Applies to plans issued or renewed from Jan. 1, 2029. (§35, new G.L. c. 176O §32; §§23, 36–38, 48)
  - heading: Should pharmacies have to give 60 days' notice before closing, with a review of whether the closure would leave an area without a pharmacy?
    house: Yes, with a public hearing if the area is likely to become a "pharmacy desert," starting Oct. 1, 2027. The Health Policy Commission assesses pharmacy deserts at least every 5 years. (§§11A, 26A, 40A–40B)
  - heading: Who should design the payment model?
    senate: A new Office of Primary Care Policy and Payment at the Health Policy Commission designs one model used the same way by all insurers, advised by a council led by the MassHealth director and the insurance commissioner. (§5, new G.L. c. 6D §3B)
    house: The state insurance commissioner approves standard models and insurer-designed alternatives, advised by a primary care payment collaborative. Payment amounts do not have to be the same across insurers. (§35, new G.L. c. 176O §31)
  - heading: Should most of the monthly payments have to stay with the primary care practice?
    senate: Yes, at least 90%, with no more than 10% used by the wider health system. (§5, §3B(e)(6))
    house: The bill sets no share. CHIA develops a way to track how much stays with the practice. (§§15, 18)
  - heading: Should insurers be barred from requiring prior approval for primary care at practices in the payment model?
    senate: Yes, including the state employee health plan. (§5, §3B(e)(8))
    house: The bill has no ban. Insurers may choose to reduce prior approval requirements as part of their primary care commitments. (§§10, 18)
  - heading: Should insurers be barred from requiring prior approval for medications that treat serious mental illness in adults?
    senate: Yes, for FDA-approved medications for serious mental illness, in the state employee health plan and private plans. (§§18, 20–22, 24)
  - heading: Should $25 million go into the Health Care Workforce Transformation Fund, with most of the fund used for primary care?
    house: Yes. Through fiscal year 2036, at least 80% of available money goes to recruiting, training and keeping primary care providers, including loan repayment and residency grants. (§§20, 40)
  - heading: Should the state pay for medical residencies in community settings, mostly at community health centers?
    senate: Yes. A new payment for community-based residencies in primary care, behavioral health and shortage specialties, with rules due within 180 days. (§19, new G.L. c. 118E §88; §32)
  - heading: Should a state reserve fund (the Commonwealth Federal Matching and Debt Reduction Fund) be usable to make up for federal cuts and support hospitals and health centers serving low-income patients?
    house: Yes, including transfers to the Health Safety Net Trust Fund and the workforce fund. (§21)
  - heading: Should large health care construction projects pay into a fund for community hospitals that rely on public insurance?
    house: Yes. At least 2% of a project's cost goes into a new Community Hospital Capital Access Fund, with total contributions capped at 5%. Qualifying community hospitals' own projects get a decision within 60 days. (§§19, 24–25)
  - heading: Should penalties for providers that don't tell patients in advance whether they're in network, and what a scheduled service costs, be delayed again?
    house: Yes, to Jan. 1, 2029. Under current law they start Jan. 1, 2027. The penalties are up to $2,500 per instance. (§39A)
  - heading: Should small employers be able to offer their own paid family and medical leave plans with fewer requirements?
    house: Yes. Employers with 25 or fewer employees could submit a private plan directly to the Department of Family and Medical Leave, without a surety bond for a self-insured plan or an approved insurer's policy forms for an insured plan. (§29A)
similarities:
  - heading: The state would set a target for primary care to reach 15% of total health care spending.
    body: The target would rise in steps, from 9% to 12% to 15%. The bills differ on the years.
  - heading: A new payment model would pay primary care practices a fixed monthly amount per patient.
    body: Payments would be adjusted for patients' medical and social needs, and behavioral health care would be built in. The bills differ on whether providers must take part.
  - heading: Practices in the model would receive at least what they would have under regular per-visit payment.
    body: The Senate measures this against past spending per patient; the House, against what each insurer's per-visit rates would have paid.
  - heading: The state's health data agency would measure and publish primary care spending.
    body: This includes spending on children's care and breakdowns by city or town and rural area.
  - heading: The state would watch that more primary care spending doesn't raise overall costs or premiums.
    body: The state's Health Policy Commission would monitor this with other state health and insurance agencies. The Senate adds a way to hold insurers and providers accountable for increases.
  - heading: The Health Policy Commission's yearly cost hearings would compare primary care spending to the target.
    body: The commission is the state agency that tracks health care costs. At its yearly public hearings, it compares spending growth with the state's cost-growth target; both bills would add the primary care target.
  - heading: Provider groups registering with the state would have to report primary care staffing, patient loads and wait times.
    body: They would also report how payments reach primary care providers. The House adds questions about purchases of primary care practices and whether practice sites are licensed or billed as part of a hospital.
  - heading: Insurers, including the state employee plan and dental plans, would have to pay community health centers at least MassHealth rates.
    body: The Senate also covers college student health plans. The House also requires MassHealth to keep paying health centers the way it did on Jan. 1, 2025.
