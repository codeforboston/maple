id: primary-care
name: Primary Care
court: 194
title: An Act relative to primary care for you
gist: Both bills would set a statewide target for primary care's share of health care spending and create a payment model that pays practices a fixed monthly amount per patient. They differ on how fast the target phases in and whether the model would be mandatory. The House bill also covers many other topics, from drug rebates to child sexual abuse lawsuits.
