id: primary-care
name: Primary Care
court: 194
title: An Act relative to primary care for you
gist: Both bills set a statewide goal of raising primary care to 15 percent of total health care spending, require insurers to pay community health centers at least MassHealth rates, and create an "advanced primary care" payment model that pays practices a fixed monthly amount per patient. They differ on how fast the target phases in, whether individual providers and insurers face their own targets and fines, and whether the payment model is mandatory. The House version is twice as long and adds many provisions the Senate lacks, from drug-rebate pass-through to limits on AI in coverage reviews to time limits for child sexual abuse lawsuits.
