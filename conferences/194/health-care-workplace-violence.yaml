id: health-care-workplace-violence
name: Health Worker Safety
court: 194
title: An Act requiring health care employers to develop and implement programs to prevent workplace violence
gist: "Both bills require hospitals and state-overseen health facilities to assess workplace-violence risks every year, adopt prevention plans, report incidents, and give paid leave to employees injured in on-the-job assaults. The biggest split is criminal law: the House creates new felonies for assaults that injure covered workers, while the Senate instead lets police arrest without a warrant for misdemeanor assaults. They also differ on who enforces the prevention rules."
