id: health-care-workplace-violence
name: Health Worker Safety
court: 194
title: An Act requiring health care employers to develop and implement programs to prevent workplace violence
gist: "Both bills would require hospitals and state-overseen health facilities to run violence prevention programs and give paid leave to workers injured in assaults. They split on criminal law: the House would make knowingly and intentionally assaulting a health care worker and causing injury a new crime with a possible state prison sentence, while the Senate would instead allow warrantless arrests for misdemeanor assaults on workers at hospitals."
