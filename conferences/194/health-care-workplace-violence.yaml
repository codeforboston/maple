differences:
  - heading: Should assaulting a health care worker and causing injury become a new crime, with a possible state prison sentence?
    house: "Yes. Knowingly and intentionally assaulting a covered worker on the job and causing bodily injury: up to 5 years in state prison, or up to 2½ years in a house of correction, and/or a fine of $500 to $5,000. Causing serious bodily injury: up to 10 years in state prison, with the same alternatives. (§5, new G.L. c. 265 §13I½)"
  - heading: Should police be able to arrest someone without a warrant for a misdemeanor assault on a health care worker, and where?
    senate: Yes, when police have probable cause, for misdemeanor assaults on covered workers at licensed hospitals and the UMass teaching hospital. Police must use de-escalation, diversion and, where available, community behavioral health crisis services. One year after the law takes effect, this extends to all covered facilities, including facilities and group homes overseen by the Departments of Public Health, Mental Health and Developmental Services. (§§6, 7, 10; G.L. c. 276 §28)
  - heading: Which workers would the law protect, and are community health centers left out?
    senate: Employees of a covered employer, contractors working at a facility, and anyone volunteering or taking a course there, as separate groups. None has to be providing health care. Community health centers (federally qualified health centers) are added to the facilities left out of the law. (§1, new G.L. c. 111 §250(a))
    house: 'As amended on the House floor: employees and contractors "who [are] providing health care services at, volunteering at or participating in an educational course" at a facility. The House bill does not leave out community health centers. (§1, new G.L. c. 111 §250(a))'
  - heading: Who can take an employer to court for not following the prevention rules, and what are the penalties?
    senate: Only the Attorney General, in superior court, seeking court orders and a civil penalty of up to $5,000 per violation. (§1, new G.L. c. 111 §250(f))
    house: Fines of up to $2,000 per violation. The Department of Public Health, any affected employee, any interested party or a union officer may file a complaint in district court, with notice to the Attorney General, who may order a facility closed after finding a violation. (§1, new G.L. c. 111 §250(f))
  - heading: Which safety complaints would be protected from retaliation?
    senate: Complaints or warnings to the employer or to the Department of Public Health. (§1, new G.L. c. 111 §250(g))
    house: Complaints or warnings to the Department of Public Health. The bill does not mention complaints to the employer. (§1, new G.L. c. 111 §250(g))
similarities:
  - heading: Hospitals and facilities run, funded or overseen by three state health departments would need violence prevention programs.
    body: The departments are Public Health, Mental Health and Developmental Services, and group homes are included.
  - heading: Facilities would have to assess the risk of violence every year.
    body: Each facility assesses its own risks with its employees and their unions, using state standards and ten listed risk factors, such as late-night work, working alone and short staffing.
  - heading: Facilities would report incidents every year, and the state would publish the data.
    body: Reports go to the Department of Public Health and the district attorney, and the department publishes combined data by county and statewide within 90 days.
  - heading: Injured workers would get paid leave without first using up other leave.
    body: This applies to the employer's own employees (not contractors) and runs at the same time as state paid family and medical leave.
  - heading: Prevention programs would include training, a system for reporting and tracking incidents, and a written plan.
    body: Employees can see the plan, and unions can get it on request. It covers the risks, the steps to reduce them and a debriefing process after incidents.
  - heading: Workers taking the leave would have job protections.
    body: Employers could not retaliate against or fire a worker for taking the leave, and would have to give the job back afterward. Leave records would be confidential.
  - heading: Employers would have to support staff who are assaulted.
    body: A senior manager oversees a crisis response team that offers counseling, support groups and other help to assaulted staff.
  - heading: Assaulted workers could list a work or union address instead of their home address on complaint papers.
    body: Both cover facility employees, EMTs and ambulance staff; the Senate adds other health care providers. The facility or union must pass court papers on promptly.
