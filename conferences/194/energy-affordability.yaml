id: energy-affordability
name: Energy Affordability
court: 194
title: An Act relative to energy affordability, clean power and economic competitiveness
gist: Both bills create a new office at the state Department of Energy Resources to sign long-term clean energy contracts (at least 10 GW of offshore wind and about 10 GW of solar by 2040), a new solar incentive, discount rates for low- and moderate-income customers, and new rules for competitive electricity suppliers. They split most sharply on Mass Save (a House-ordered $1 billion cut vs. a Senate restructuring from 2028), on nuclear power, on gas-system spending and planning, and on a set of Senate-only limits on what utilities may charge customers for.
