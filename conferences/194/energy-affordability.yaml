differences:
  - heading: Should Mass Save, the state's energy efficiency program paid for through utility bills, be ordered to cut at least $1 billion from its current 2025–2027 plan?
    senate: No cut is ordered. Under the Senate's rewrite of the program, starting Jan. 1, 2028, planning and administration costs are capped at 5% of efficiency spending. (§16; §115)
    house: Yes. The utilities and towns that run the program were to file changes saving ratepayers at least $1,000,000,000, cutting marketing, advertising and administration first, by July 1, 2026. That date has passed. The Department of Public Utilities (DPU) would approve the changes within 60 days. (§69)
  - heading: Should Mass Save focus on cutting building emissions and be run only by electric utilities and city and town electricity programs?
    senate: "Yes, starting Jan. 1, 2028: one statewide plan, gas companies no longer run programs, and at least 20% of funds for low-income programs. The current ban on incentives for new fossil-fuel equipment, with some exceptions, continues. (§§9–17, 115, 117)"
  - heading: Should new nuclear plants still need approval from voters statewide, and should nuclear power count as "clean energy"?
    senate: The Senate bill does not repeal the 1982 law. It adds "nuclear fission" and "fusion energy" to the Massachusetts Clean Energy Center's definition of clean energy. (§4)
    house: Repeals chapter 503 of the Acts of 1982 (§55), the voter-approved law that bars building a new nuclear plant, or a low-level radioactive waste facility, without a statewide vote and findings certified by the Legislature. The House bill does not otherwise mention nuclear power.
  - heading: Should the cap on yearly increases in the charges gas utilities collect to replace aging pipes (known as GSEP) phase down to zero?
    senate: Yes. Today the yearly increase is capped at 1.5% of revenues, and DPU may allow more. The Senate keeps 1.5% from November 2027, steps it down to zero from Nov. 1, 2030, and ends DPU's power to allow more or to let amounts over the cap be recovered the next year. The leak-reduction targets and penalties already in law stay. (§83, G.L. c. 164 §145)
  - heading: Should utilities be barred from charging customers for advertising, lobbying, trade group dues, charitable donations, and travel and entertainment for their boards and officers?
    senate: Yes. Utilities already can't charge customers for promotional or political advertising; the Senate widens that and adds lobbying, trade group dues, charitable donations, political contributions and board members' travel and entertainment. A utility that breaks the rule pays a penalty at least equal to the improper costs, which it cannot pass on to customers, and refunds customers with interest. (§56, G.L. c. 164 §33A)
  - heading: Should competitive electricity suppliers be barred from serving low-income customers, or allowed to at a capped price?
    senate: Allowed, at a price no higher than the utility's average standard rate over the past 12 months. (§53, G.L. c. 164 §1L(a))
    house: Barred for customers on the discounted low-income rate, except through city and town electricity programs. (§26, G.L. c. 164 §1L(b))
  - heading: What energy rules should apply to large data centers?
    senate: Conditions on the data center sales tax exemption, set by the state economic development office, covering clean energy, efficiency, water, labor and community benefits. (§§3, 109)
    house: Data centers of 20 megawatts or more that need a DPU or Energy Facilities Siting Board permit must buy at least 80% renewable energy and show batteries are not feasible before using fossil-fuel backup. Utilities must file data center rates that protect other customers from higher costs. (§§54, 68E)
  - heading: Should the state forecast demand for natural gas and adopt a yearly gas supply plan?
    senate: Yes. Rolling 3-year forecasts, and a yearly plan from the Secretary of Energy and Environmental Affairs that "ensures pipeline capacity and system reliability measures" consistent with climate goals, after at least 3 public hearings. (§64)
  - heading: Should gas companies be allowed to end gas service to customers who have adequate other ways to heat their homes and water?
    senate: Yes, under DPU rules, if the customer keeps safe, reliable and affordable heat and hot water. (§83, G.L. c. 164 §145(h))
  - heading: Should utilities be able to pay for grid upgrades, gas transition costs and storm costs with bonds repaid through a charge on customers' bills (known as securitization)?
    senate: Yes, if DPU finds it cost-effective and that it lowers costs for customers. Bonds may run up to 30 years, and none may be issued after 2036 without new legislation. (§52, G.L. c. 164 §1H)
  - heading: Should companies bidding on state clean energy contracts have to submit plans for project labor agreements and consult tribes and fishing interests?
    senate: Not required. Bidders submit a plan for benefits to low- and moderate-income customers. (§36, G.L. c. 25A §22(g)–(h))
    house: Yes, along with plans for benefits to low-income customers and environmental justice communities. (§13)
  - heading: Should permits for large clean energy transmission and offshore wind projects be extended by 4 years?
    senate: Yes, for approvals in effect between Jan. 1, 2025 and Jan. 1, 2029. (§97)
  - heading: Should utilities be barred from shutting off electric service to customers in financial hardship during summer heat waves?
    senate: Yes. No electric shutoffs for financial hardship from May 15 to Sept. 15 during forecast heat of 85°F or more for 3 days in a row. The winter ban on heat-related shutoffs (Nov. 15 to Mar. 15) is already law and stays. (§71, G.L. c. 164 §124F)
    house: Not in the bill. The winter ban continues.
  - heading: Should companies selling home and community solar be licensed, with registered salespeople and a right to cancel?
    senate: Not required. A working group led by the Attorney General and DPU recommends changes by Jan. 31, 2028. (§113)
    house: Yes. DPU licenses sellers, salespeople register every year, standard disclosures are required, buyers may cancel within 5 business days, community solar contracts may not carry early termination fees, and penalties run up to $2,500 a day. (§§26, 73–75)
  - heading: Should each supplier's average rates be made public?
    senate: Yes, by type of customer, and supplier rate reports are public. (§§25, 53)
    house: Only combined or anonymous data is published. (§§6, 26)
similarities:
  - heading: A new office at the Department of Energy Resources would sign long-term clean energy contracts.
    body: Contracts could run up to 30 years and would include at least 10 gigawatts of offshore wind and about as much solar by 2040.
  - heading: The state would invest in early development work for offshore wind, to be repaid once projects start operating.
    body: The state could co-invest in early work such as permitting, site and environmental studies, and engineering, favoring projects that have already competed for state contracts. The goal is to speed projects up and lower their risks.
  - heading: The Department of Energy Resources would have to run a solar incentive program and could create one for energy storage.
    body: It already runs one for solar, known as SMART, under a 2016 law; both bills would add a similar requirement to the state's general laws. The storage program would be up to the department.
  - heading: The discount rule for low- and moderate-income customers would be rewritten to name gas companies as well as electric companies.
    body: Electric companies already must offer these discounts, and who qualifies would not change. Both bills would pay for them through a fixed monthly charge on other customers' bills; the House's version starts a year later.
  - heading: Cities and towns could bar competitive electricity suppliers from signing up individual residents.
    body: These are private companies that sell electricity in place of the utility's standard supply. A city or town would first have to vote to opt in, and its own electricity buying program would not be affected.
  - heading: Competitive suppliers, brokers and marketers would face bonds, higher fines and new sales rules.
    body: Licenses are already required. Both bills would raise fines, ban early termination fees and create a state website for comparing offers; the bond amounts and fine details differ.
  - heading: The Department of Public Utilities would publish an online dashboard explaining utility bill charges.
    body: It would use charts to show what makes up each utility's residential bills, now and over time, explain each charge, and analyze the benefits of programs customers pay for, such as energy efficiency.
  - heading: Large rebuilds of existing transmission lines would need state siting review.
    body: This covers projects costing $25 million or more.
  - heading: Utilities' grid plans would include virtual power plants, targets for cutting peak demand, and flexible grid connections.
    body: A virtual power plant coordinates many customers' devices, such as batteries, smart thermostats and electric vehicles, to balance demand. Flexible connections let new projects connect if they agree to limit their use or output at set times.
  - heading: Utilities would offer on-bill financing for heat pumps, solar and efficiency upgrades.
    body: There is no up-front cost; repayment is through an optional charge on the electric bill. Deadlines differ.
  - heading: Gas companies could provide heat from clean sources, and build and run the systems that deliver it.
    body: The House bill names geothermal systems. Companies would be subject to safety oversight, pay prevailing wages and plan for their workers' transition.
  - heading: Mass Save would have to check household income before giving moderate-income rebates in certain communities.
    body: These are the equity communities named in Mass Save's current three-year plan. Low-income customers would not need the check.
  - heading: The state's 2030 and 2050 emissions limits would not change.
    body: The limits are set in the state's climate law.
