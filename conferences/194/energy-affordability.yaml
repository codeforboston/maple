id: energy-affordability
name: Energy Affordability
court: 194
title: An Act relative to energy affordability, clean power and economic competitiveness
gist: "Both bills would create a state office to sign long-term clean energy contracts. They split most on Mass Save, the efficiency program paid for through utility bills: the House would order a cut, and the Senate would restructure it from 2028. They also differ on nuclear power, what utilities can bill customers for and energy rules for data centers."
