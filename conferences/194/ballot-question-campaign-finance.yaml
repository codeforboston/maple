differences:
  - heading: Should the law spell out that efforts to get a question onto the ballot, or to keep it off, count as campaign activity that must be reported?
    senate: Yes. Supporting or opposing a ballot question includes "actions to place or oppose placing a question on a statewide election ballot," but not lobbying the Legislature. The state campaign finance office (OCPF) defines those actions by regulation, including the extent to which they include polling, research, legal and consulting work. Money raised or spent for them does not have to be disclosed until the Secretary of the Commonwealth makes the petitions available. (§3, G.L. c. 55 §1)
  - heading: Should a special commission study the ballot question process and recommend changes, including to the state constitution?
    house: "Yes. A 13-member commission, led by the chairs of the Legislature's election laws committee, would include the chairs of the judiciary committee, the Secretary of the Commonwealth, the Attorney General, a House member and a senator named by the minority leaders, two people representing labor, trade or business groups that have backed or opposed ballot questions (one named by the Speaker, one by the Senate President), and three people appointed by the Governor: a retired Supreme Judicial Court justice, a Common Cause Massachusetts representative and a city or town clerk. It would study the Attorney General's review of proposed questions, petition summaries, signature requirements (including paid signature gathering) and deadlines. Its report, due Dec. 31, 2027, would include draft constitutional amendments and any draft legislation or regulations. (§§14, 16)"
  - heading: After each election, should state officials certify whether ballot campaigns followed the rules?
    house: Yes. Within 60 days after the state election, the Secretary of the Commonwealth certifies whether each petition campaign followed the ban on paying by the signature, and OCPF certifies whether each ballot question committee followed the finance rules. OCPF files an update within 30 days of referring any case to the Attorney General. The reports go to the Legislature and are public. (§2, new G.L. c. 53 §22A½(c); §5, G.L. c. 55 §3)
  - heading: Should petition forms and voter materials tell people where to find the campaigns' finance reports?
    house: Yes. Petition forms must direct signers to OCPF's website for the reports of committees for and against the petition, and a similar notice for voters is added under G.L. c. 54 §53. (§1, G.L. c. 53 §22A; §2A, G.L. c. 54 §53)
similarities:
  - heading: Statewide ballot question committees would report the way candidates for statewide office do.
    body: Each committee would keep its money in a designated bank and deposit donations within 7 days. The bank and the committee would each report to the state campaign finance office every month. Today committees file no reports between their January report and 60 days before the election.
  - heading: Signature gatherers could not be paid per signature.
    body: Nothing of value, including bonuses, may be tied to the number of signatures. Fines run from $100 to $10,000, and each signature collected this way is a separate violation.
  - heading: Petition forms would have to say when the person collecting signatures is paid.
    body: The notice must be clear and in a form the Secretary of the Commonwealth sets.
  - heading: Large contributions received just before the election would have to be reported within 72 hours.
    body: Contributions of $500 or more received between 18 days and 72 hours before the election must be reported within 72 hours of being deposited.
  - heading: Outside groups giving or spending on a statewide ballot question would report monthly, not just in the final 60 days.
    body: That means businesses, unions and others that aren't political committees. Today their first report is due 60 days before the election; the reports after that would stay the same.
  - heading: Ballot question campaigns would have to list each donation of goods or services over $50, and any new debts.
    body: Each entry would include names, addresses and purpose.
