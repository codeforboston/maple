id: ballot-question-campaign-finance
name: Ballot Question Finance
court: 194
title: "An Act improving campaign finance reporting for statewide ballot questions "
gist: "Both bills set new reporting rules for statewide ballot question campaigns: monthly, then twice-monthly, filings, 72-hour reports of late contributions of $500 or more, itemized in-kind contributions and debts, and a ban on paying petition circulators by the signature. They differ on whether money spent to get a question onto the ballot counts as campaign activity (Senate only), and on post-election compliance reports, voter notices and a commission on the initiative process (House only)."
