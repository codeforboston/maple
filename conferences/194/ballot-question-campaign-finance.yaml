id: ballot-question-campaign-finance
name: Ballot Question Finance
court: 194
title: "An Act improving campaign finance reporting for statewide ballot questions "
gist: Both bills would make statewide ballot question committees report the way statewide candidates do and ban paying signature gatherers by the signature. Only the Senate says efforts to get a question onto the ballot, or keep it off, count as campaign activity. Only the House adds a study commission, post-election compliance checks and notices pointing signers and voters to finance reports.
