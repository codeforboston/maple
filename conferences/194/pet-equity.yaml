id: pet-equity
name: PETS Act
court: 194
title: An Act promoting pet equity, treatment and safety
gist: Both bills would create a pet ownership program in public housing and limit animal testing where valid alternatives exist. Only the Senate would ban dog and cat sales in pet shops, extend "cruel conditions" rules to all pets and bar home insurers from considering dog breed. Only the House would license veterinary technicians and regulate pet insurance, among other changes.
