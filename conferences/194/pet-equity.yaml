differences:
  - heading: Should pet shops be barred from selling dogs and cats, and allowed only to host adoptions from rescues and shelters?
    senate: Yes. Licensed pet shops may not sell dogs or cats but may host adoptions by rescues and shelters. Fines up to $1,000 for a first violation, $2,500 for a second and $5,000 after that, with each sale or ad counted separately, plus possible loss of the shop's license. Takes effect 180 days after the law passes. (§§4–6, G.L. c. 129 §39A; §18)
  - heading: Should the "cruel conditions" rules for dogs cover all household pets, with a broader definition?
    senate: Yes. Today the rules cover only dogs (G.L. c. 140 §174E(f)–(g)). The Senate extends them to any household pet and spells out more cruel conditions, including lack of food and water, of protection from bad weather and of chances to go outdoors; inhumane chaining or tethering of dogs stays one. Penalties stay a written warning or fines up to $50, $200 and $500, with possible impoundment or loss of ownership on a third offense. (§§10–13, G.L. c. 140 §174E)
  - heading: Should the ban on animal testing (where alternatives exist) cover all products, or only cosmetics and household products?
    senate: It applies "when testing a cosmetic or household product, product formulation, chemical or ingredient." Rules are due within 180 days of the law passing. (§14, new G.L. c. 140 §174I; §19)
    house: It applies "when testing a product, product formulation, chemical or ingredient," with valid alternatives "as determined by the commissioner" of public health. Rules are due Dec. 24, 2026, and the ban takes effect 180 days after the law does. (§29; §§40, 42)
  - heading: Should home and renters insurers be barred from considering a dog's breed?
    senate: Yes. Insurers may not ask about breed or use it to decide whether to issue, renew, cancel or price a policy. They may consider whether a dog has been declared dangerous or has a bite history. (§15, new G.L. c. 175 §4C½)
  - heading: Which public housing residents should the pet ownership program cover?
    senate: Residents of state-aided public housing who are "(i) the elderly; and (ii) residents who are able to reasonably care for a pet." (§2, new G.L. c. 23B §37(b))
    house: '"Older adults" (60 or older) in public housing who can reasonably care for a pet. (§4, new G.L. c. 23B §5C(a)–(b))'
  - heading: Should ride-hailing drivers and companies be fined for breaking service-animal and disability rules?
    house: Yes. Drivers already must follow the laws on service animals, and companies may not charge riders with disabilities more. The House adds fines for drivers and companies that break these rules (up to $500 for a first offense, $750 for a second and $1,000 after that), and requires apps to let riders tell drivers they will bring a service animal. (§§30–31, G.L. c. 159A½ §§2(g), 7(e))
  - heading: Should police and animal control officers be able to ask a court to order care for, or removal of, a neglected animal?
    house: Yes. A district court holds a hearing within 10 days, with at least 3 days' notice to the owner. If it finds neglect, the court may order the animal given up, humanely euthanized or given specific care, and may bar the person from having custody of animals. (§25, new G.L. c. 140 §151D)
  - heading: Should the state set consumer protection rules for pet insurance?
    house: Yes. Insurers must disclose exclusions, waiting periods and limits. Buyers who haven't filed a claim get a full refund if they cancel within 30 days, insurers must prove a preexisting-condition exclusion applies, waiting periods for illness are capped at 30 days with none for accidents, and wellness plans must be kept separate from insurance. Takes effect 180 days after the law passes. (§32, new G.L. c. 175 §162AA; §43)
  - heading: Which dogs may public housing refuse?
    senate: Dogs a city or town has declared a nuisance or dangerous, and dogs with a known history of biting or injuring a person or animal. (§2, §37(d))
    house: Only dogs a city or town has declared dangerous. (§4, §5C(d))
  - heading: Should the state study pet fees charged by public and private landlords?
    senate: Yes. The state housing office studies pet fees and their effect on housing stability and on animals given up to shelters, and reports by Dec. 31, 2027. (§17)
  - heading: Should the state license veterinary technicians?
    house: Yes. Licenses for graduates of accredited programs who pass an exam, a path for people without the degree until Nov. 1, 2031, temporary licenses for currently certified technicians, and a license required for all by July 1, 2031. Research institutions, zoos, aquariums and wildlife rehabilitators are exempt. The state veterinary board adds 3 technician members and a second public member. (§§3, 5–9, 34, 36–39, 41)
  - heading: Should dog licensing and kennel rules change?
    house: Yes. Kennels may not accept unlicensed dogs, must keep transfer records for 36 months, and lose their licenses for unsanitary conditions. Public kennel lists show inspection results, and the state may fine licensing authorities that break the rules. The existing fines of up to $100 for removing a dog's tag, keeping someone else's animal without permission, or holding a stray more than 48 hours without reporting it move into the dog licensing law, where special officers of the MSPCA and Animal Rescue League can enforce them by ticket. (§§13–24, 33)
similarities:
  - heading: Public housing would have a pet ownership program.
    body: The state housing office would run it for residents who can reasonably care for a pet. The bills differ on which residents are eligible.
  - heading: Public housing could not ban pets outright or reject a pet just for its breed, size, weight or appearance.
    body: It also could not require declawing, or evict a tenant only for having a pet when the tenant follows the rules.
  - heading: Animal testing would be banned where a valid alternative exists.
    body: The state health department would set standards, drawing on international guidelines. Medical research would be exempt. The bills differ on which products are covered and when the ban starts.
  - heading: Fines under the state's livestock disease control law would go to the Homeless Animal Prevention and Care Fund.
    body: The state agriculture commissioner can impose these fines, up to $500 per violation.
  - heading: Public housing could set conditions such as a capped pet deposit and limits on the number of pets.
    body: The deposit could be no more than $160 or one month's rent, whichever is less. Housing could also require spaying or neutering, a care plan and registration.
  - heading: More labs would have to try to place dogs and cats for adoption, through a rescue partner.
    body: Some labs already must try to place these animals. Both bills would cover more labs and require each to partner with an animal rescue group.
  - heading: Labs would report every year on these animals.
    body: Reports would count how many animals were offered for adoption or euthanized. The bills differ on which agency receives them.
