id: pet-equity
name: PETS Act
court: 194
title: An Act promoting pet equity, treatment and safety
gist: Both bills create a pet ownership program in public housing, require research labs to try to place dogs and cats for adoption, limit animal testing where a valid alternative exists, and route certain fines to the Homeless Animal Prevention and Care Fund. Beyond that they diverge. Only the Senate bans dog and cat sales in pet shops, adds "cruel conditions" fines and bars home insurers from using dog breed. Only the House licenses veterinary technicians, regulates pet insurance, lets courts act on neglected animals and revises kennel and licensing rules.
