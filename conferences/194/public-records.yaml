differences:
  - heading: If the Legislature turns down a records request, which court can review it, and how closely?
    senate: A petition for review in Suffolk Superior Court, filed within 60 days. The court looks only at the existing record (it may view the withheld documents privately) and decides only whether there were "substantial errors of law." It cannot issue orders such as injunctions, and cannot award costs, fees or damages except under G.L. c. 231 §6F. (§5, new G.L. c. 66 §22(e)(5))
    house: A petition to the Supreme Judicial Court, which decides the question fresh ("de novo") and as quickly as feasible. Every record is presumed public, and the records officer must show by a preponderance of the evidence that it may be withheld. (§3, new G.L. c. 3 §77(f)(5))
  - heading: Should the law set rules and limits for the State Auditor's audits of the Legislature?
    house: Yes. Current law (G.L. c. 11 §12) directs the Auditor to audit "the general court itself" and lets the superior court enforce requests for records. The House would limit these audits to the Legislature's budgets, audits, spending and settlement payments from fiscal year 2021 on. The Auditor could request four kinds of records (answer due in 60 days) and interviews the presiding officer authorizes (answer due in 30 days). If the presiding officer declines, the only remedy is a "statement of dispute" in the published audit; no court may order the records produced. (§3, new G.L. c. 3 §76; §5, G.L. c. 11 §12)
  - heading: Should legislative records officers also be able to use the exemptions in the general public records law?
    senate: Yes. Besides the same grounds the House bill gives, an officer may withhold or black out anything covered by the general public records law's exemptions (G.L. c. 4 §7, clause Twenty-sixth), which from 2027 include Question 1's new ones for constituent casework and policy documents. (§5, new G.L. c. 66 §22(e)(1))
    house: "Its rules for withholding records don't include those exemptions. Officers may withhold only on the bill's own grounds: the record is not on the list, its release would conflict with Article XXI of the Massachusetts Declaration of Rights (which protects legislative debate), or the section otherwise allows it. (§3, new G.L. c. 3 §77(f)(1))"
  - heading: Should there be a law limiting when journalists can be forced to reveal confidential sources?
    senate: "Yes. Courts, grand juries and others with subpoena power could not force a journalist or news organization to reveal a confidential source. The exception: after notice and a hearing, a court finds by clear and convincing evidence that the information is material, critical to a claim or defense, and not available elsewhere, and that there is an overriding public interest in disclosure. It also covers subpoenas to third parties holding journalists' records. Criminal defendants' constitutional rights are not affected. (§6, new G.L. c. 233 §20P)"
  - heading: Should the new process reach Legislature records created before 2027?
    senate: No. It applies to records made or received on or after Jan. 6, 2027. Records officers may still help people find earlier records that are readily available. (§7)
    house: The bill sets no starting date for legislative records and has no effective-date section. The Auditor's authority reaches back to fiscal year 2021. (§3, new G.L. c. 3 §§76(a), 77(a))
  - heading: Should the Legislature be able to charge fees for records, and with what limits?
    house: "Yes, up to actual cost: no more than 5 cents a page, and no more than $25 an hour for staff time after the first 4 hours. Higher fees are allowed for commercial or justified requests. No fee if the 10-business-day deadline is missed, and fees may be waived for requests in the public interest or for people who can't pay. (§3, new G.L. c. 3 §77(e), (d)(2)(viii))"
  - heading: Beyond the records both bills list, what else should be open, and whose records count?
    senate: Adds names, office addresses, job titles and salaries of members and staff as kept by human resources, plus contracts and purchasing records (with exceptions). Covers records kept by caucuses as well as members and staff. Covers only testimony "solicited and received by a committee." Officers may not release public records that aren't on the list. (§5, new G.L. c. 66 §22(a), (c))
    house: Adds lists of legislative caucuses and their members, and final State Auditor reports. Covers records "made or received" by the Legislature, its members, officers and employees. (§3, new G.L. c. 3 §77(a))
  - heading: Should the bill include money to carry out the new rules?
    house: "Yes, $1,000,000 for fiscal year 2026: $250,000 each for the Governor's office, the Senate, the House and joint legislative operations. That fiscal year has ended. (§§1–2)"
similarities:
  - heading: The Legislature would handle requests for its records itself, for a set list of final records.
    body: That process would be the only way to get them; the general public records law would not apply to the Legislature.
  - heading: The Legislature would have to provide a set list of records, including bills, testimony, votes and spending records.
    body: "Among them: hearing recordings, committee votes and reports, roll calls, salaries, payments to vendors, final internal audits and ethics disclosures."
  - heading: The Legislature would have to respond to requests within 10 business days.
    body: If records will be held back or a request is unduly burdensome, the Legislature would explain in writing and have up to 30 business days. Records would come electronically where possible.
  - heading: Someone refused records could first ask the records officer to reconsider.
    body: The officer's final decision would go to the chamber's Rules Committee, which could reverse or change it. The state Supervisor of Records, who hears other records appeals, would have no role.
  - heading: Each chamber would appoint a records officer to handle requests.
    body: The officer's contact information is posted. Officers help people find records and publish guidelines for making requests.
  - heading: The Legislature could withhold records that aren't on the list or that could endanger people or property.
    body: Blueprints and security plans are examples of records that could endanger people. Records whose release would conflict with the constitution's protection for legislative debate could also be withheld. Refusals would have to be in writing, with reasons.
  - heading: For the Governor's office, both bills would reach only records from early January 2027 on.
    body: Question 1, which takes effect Jan. 1, 2027, has no such date limit. The bills' start dates differ by a day.
