differences:
  - heading: Who would get the second chance to join the enhanced retirement benefit?
    senate: Teachers, as defined in state retirement law, in the teachers' or Boston retirement system who joined and began paying in before July 1, 2001, were eligible for the program, and did not join it before July 1, 2001. (subsection (a))
    house: Teachers or school nurses who joined and began paying into the teachers' retirement system before July 1, 2001, and did not join the program before July 1, 2001 "or at any other time prior to September 1, 2025." (§4(a))
  - heading: What would teachers who join have to pay for past years, and would they owe interest?
    senate: The difference between 11% of their pay and what was actually taken out, going back to July 1, 2001, plus interest at the system's assumed rate, compounded yearly. They may pay all at once or in installments. (subsection (c))
    house: Teachers "may be required" to make up contributions at 11% from the date they joined their retirement system, on terms the system sets. The bill does not mention interest. (§4(b))
  - heading: Should teachers who join but never meet the program's service requirements get their extra payments back?
    senate: Yes, with regular interest, when they leave or retire. (subsection (e))
  - heading: How long would teachers have to decide, and could they change their minds?
    senate: From the day the law takes effect through June 30, 2027. The choice is final, and anyone who doesn't sign up in time is treated as having declined. (subsections (b), (d))
    house: 180 days from the day the law takes effect. The bill does not say whether the choice can be reversed. (§4(a))
  - heading: Should teachers who take jobs at the state Executive Office of Education or Department of Elementary and Secondary Education keep their teacher retirement status?
    house: Yes. Teachers vested in the teachers' or Boston retirement system who take jobs there keep teacher status, and any teacher who takes a job there stays in that retirement system. Employees there who are moved back from the state employees' system have no break in service but must pay any difference in contributions, and at retirement they are entered into the state employees' system as group 1 state employees. (§§1–3, G.L. c. 32 §§1, 3(8))
similarities:
  - heading: Some teachers who joined before 2001 would get a new one-time chance to join the enhanced retirement benefit.
    body: It would cover qualifying members who did not join earlier, whether or not they are still working. The bills differ on exactly who qualifies.
  - heading: Teachers who join would pay 11% of their pay going forward.
    body: That's what teachers hired since July 2001 already pay. Teachers hired earlier who never joined pay a lower rate now, set by when they were hired.
  - heading: The teacher's retirement system would set the terms for paying for past years.
    body: The bills differ on whether those payments are required and how they are figured.
  - heading: The retirement systems would have to notify eligible teachers and school districts.
    body: The teachers' and Boston retirement systems would notify eligible members, including those no longer teaching.
