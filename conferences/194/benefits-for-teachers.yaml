id: benefits-for-teachers
name: Teacher Benefits
court: 194
title: An Act relative to benefits for teachers
gist: Both bills give certain teachers who joined the teachers' or Boston retirement system before July 1, 2001 a new one-time chance to opt into the enhanced "alternative superannuation" benefit (often called RetirementPlus) at an 11 percent contribution rate. They differ on who qualifies, what make-up payments cost, the deadline and whether the choice is final. Only the House lets vested teachers who take jobs at the Executive Office of Education or the Department of Elementary and Secondary Education keep their teacher retirement status.
