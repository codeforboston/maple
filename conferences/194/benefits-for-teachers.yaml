id: benefits-for-teachers
name: Teacher Benefits
court: 194
title: An Act relative to benefits for teachers
gist: Both bills would give some teachers who joined their retirement system before July 1, 2001 a new one-time chance to join the enhanced benefit known as RetirementPlus. They differ on who qualifies, the cost of covering past years, and the deadline. Only the House would let teachers who take jobs at certain state education agencies stay in their retirement system.
