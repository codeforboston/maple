id: student-learning-and-mental-health
name: Phone-Free Schools
court: 194
title: "An Act to promote student learning and mental health "
gist: Both bills require every public school district to adopt a policy barring student use of phones and other personal devices during the school day, with a state model policy and no suspension or expulsion as discipline. Only the House adds rules for social media platforms (an under-14 ban, parental consent at 14 and 15, age verification, feed limits), required social media instruction and a phone-disabling technology pilot. The chambers also differ on whether students may keep phones on their person.
