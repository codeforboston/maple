id: student-learning-and-mental-health
name: Phone-Free Schools
court: 194
title: "An Act to promote student learning and mental health "
gist: Both bills would require every school district to adopt a policy barring students from using phones during the school day. They differ on whether students could keep phones on them. Only the House bill would also bar social media accounts for children under 14 and require parental consent for 14- and 15-year-olds. The Senate passed a separate bill in July making platforms switch off addictive features unless they confirm a user isn't a minor.
