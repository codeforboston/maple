name: Repo Checks

on: ["push", "pull_request"]

jobs:
  check_python_quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r llm/requirements.txt
      - run: ruff check llm/
      - run: ruff format --check llm/
      - run: pytest llm/
      - run: pip install -r lobbying-scraper/requirements.txt
      # A separate run: both suites have a `tests` package.
      - run: pytest lobbying-scraper/tests

  check_code_quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo

      - name: Linting
        if: always()
        run: yarn lint

      - name: Formatting
        if: always()
        run: yarn check-formatting

      - name: Cloud Functions Tests
        if: always()
        run: yarn test

      # TODO: Add the other website tests to test:website once they pass
      - name: Website Tests
        if: always()
        run: yarn test:website

      - name: Types
        if: always()
        run: yarn check-types

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check_code_quality

    services:
      typesense:
        # Keep in sync with infra/Dockerfile.search
        image: typesense/typesense:30.2
        ports:
          - 8108:8108
        env:
          TYPESENSE_DATA_DIR: /app/data
          TYPESENSE_API_KEY: test-api-key
          TYPESENSE_ENABLE_CORS: "true"
        volumes:
          - typesense-data:/app/data

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Cache Emulators
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('~/.cache/firebase/emulators/**') }}
      - name: Smoke Test Firebase Admin CLI
        run: >
          ./node_modules/.bin/firebase --project demo-dtp emulators:exec
          --only auth,firestore
          --import tests/integration/exportedTestData
          "yarn firebase-admin run-script backfillTestimonyScope --env local"

      - name: Run Integration Tests
        run: >
          yarn test:integration-ci
          tests/integration/testimony.test.ts
          tests/integration/auth.test.ts
          tests/integration/moderation.test.ts
          tests/integration/profile.test.ts
          tests/integration/ballotQuestions.test.ts
          tests/integration/backfillTestimonyScope.test.ts
          tests/integration/conferences.test.ts
